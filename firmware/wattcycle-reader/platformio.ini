[platformio]
default_envs = reader-a

[env:reader-base]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_src_filter = +<main.cpp>
lib_deps =
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@^1.4.3

[env:bleonly]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_src_filter = +<bleonly_main.cpp>
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=0

[env:reader-a]
extends = env:reader-base
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=0
    '-DWATT_BOARD_ID="a"'
    -DWATT_BATTERY_FIRST=1
    -DWATT_BATTERY_LAST=3
    -DWATT_STAGGER_MS=0

[env:reader-b]
extends = env:reader-base
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=0
    '-DWATT_BOARD_ID="b"'
    -DWATT_BATTERY_FIRST=4
    -DWATT_BATTERY_LAST=6
    -DWATT_STAGGER_MS=12000

[env:wattcycle-reader]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_src_filter = +<main.cpp>
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=0
    '-DWATT_BOARD_ID="a"'
lib_deps =
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@^1.4.3

[env:pylon-can]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_src_filter = +<can_main.cpp>
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=0
    '-DWATT_HOSTNAME="wattcycle-reader"'
    -DWATT_CAN_TX_PIN=4
    -DWATT_CAN_RX_PIN=5
lib_deps =
    knolleary/PubSubClient@^2.8

