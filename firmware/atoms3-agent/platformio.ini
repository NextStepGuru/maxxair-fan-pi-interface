[platformio]
default_envs = fan1

[env:m5stack-atoms3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.flash_size = 8MB
extra_scripts = pre:generate_ir.py
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DDISABLE_CODE_FOR_RECEIVER
    -DNO_LED_FEEDBACK_CODE
    -DNO_LED_SEND_FEEDBACK_CODE
    -DSEND_PWM_BY_TIMER
    -DIR_SEND_PIN=4
lib_deps =
    m5stack/M5Unified
    z3t0/IRremote@^4.5.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    adafruit/Adafruit NeoPixel@^1.12.0

[env:fan1]
extends = env:m5stack-atoms3
build_flags =
    ${env:m5stack-atoms3.build_flags}
    '-DFAN_HOSTNAME="maxxair-fan1"'

[env:fan2]
extends = env:m5stack-atoms3
build_flags =
    ${env:m5stack-atoms3.build_flags}
    '-DFAN_HOSTNAME="maxxair-fan2"'

[env:fan3]
extends = env:m5stack-atoms3
build_flags =
    ${env:m5stack-atoms3.build_flags}
    '-DFAN_HOSTNAME="maxxair-fan3"'
